name: Verify app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Package complete verified system
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: DERIV-MATRIX-FULL-SYSTEM
          path: |
            .
            !node_modules/**
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
