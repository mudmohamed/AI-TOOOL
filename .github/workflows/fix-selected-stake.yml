name: Verify selected stake fix

on:
  push:
    branches:
      - fix-exact-selected-stake-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact stake and target patch
        run: python3 .github/scripts/fix_selected_stake.py
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified fix
        run: |
          git config user.name "Restore Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/derivWs.ts
          git commit -m "Preserve exact selected stake and target"
          git push origin HEAD:fix-exact-selected-stake-20260916
