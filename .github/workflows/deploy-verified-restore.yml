name: Deploy verified restore to Vercel production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-verified-restore.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_HHOMaGRKFqWbg01VM1kNstYl
      VERCEL_PROJECT_ID: prj_80wcuj4nHsTPzB9Fn86bTcZ0ZajN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preserved trading logic
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "sameLossStake" src/App.tsx
          ! grep -Fq "calculateNextStake(" src/App.tsx
          ! grep -Fq "Configured loss limit reached. Auto-Matches stopped." src/App.tsx
          grep -Fq "private readonly bridgeUrl" src/services/derivWs.ts
          grep -Fq "AutoTradingSystemHero" src/App.tsx
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Deploy exact verified head to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN secret is not configured for this repository."
            exit 78
          fi
          npm install --global vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
      - name: Remove one-time deploy workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deploy-verified-restore.yml
          git config user.name 'Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy-verified-restore.yml
          git commit -m 'Remove one-time Vercel deploy workflow'
          git push origin HEAD:main
