name: Restore original full system UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-original-system-ui.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore original system UI around preserved live engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          s = p.read_text()

          import_anchor = "import { AutoMatchesSafetyModal } from './components/AutoMatchesSafetyModal';\n"
          import_line = "import { AutoTradingSystemHero } from './components/AutoTradingSystemHero';\n"
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('AutoTradingSystemHero import anchor not found')
              s = s.replace(import_anchor, import_anchor + import_line, 1)

          main_anchor = '      <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">\n'
          hero_lines = [
              '        <AutoTradingSystemHero',
              '          isRunning={autoMatchesActive}',
              '          onToggleRun={handleToggleAutoMatches}',
              '          config={autoMatchesConfig}',
              '          onConfigChange={(config) => {',
              '            setAutoMatchesConfig(config);',
              "            try { localStorage.setItem('deriv_auto_matches_config', JSON.stringify(config)); } catch {}",
              '          }}',
              '          currentSymbol={currentSymbol}',
              '          onSelectSymbol={handleSelectSymbol}',
              '          symbols={POPULAR_SYMBOLS}',
              '          currentPrice={currentPrice}',
              '          lastDigit={lastDigit}',
              '          pip={pip}',
              '          targetDigit={currentAnalysis?.hotDigit}',
              '          accountInfo={accountInfo}',
              '          sessionStats={sessionStats}',
              '          tradeHistory={tradeHistory}',
              '          onOpenSafetyModal={() => setIsSafetyModalOpen(true)}',
              '          onOpenConnectModal={() => setIsConnectModalOpen(true)}',
              '          onResetSession={handleResetSession}',
              '        />',
              '',
          ]
          hero = '\n'.join(hero_lines) + '\n'
          if '<AutoTradingSystemHero' not in s:
              if main_anchor not in s:
                  raise SystemExit('main UI anchor not found')
              s = s.replace(main_anchor, main_anchor + hero, 1)

          p.write_text(s)
          PY

          grep -Fq "sameLossStake" src/App.tsx
          ! grep -Fq "calculateNextStake(" src/App.tsx
          ! grep -Fq "Configured loss limit reached. Auto-Matches stopped." src/App.tsx
          grep -Fq "AutoTradingSystemHero" src/App.tsx
          grep -Fq "private readonly bridgeUrl" src/services/derivWs.ts

          npm ci --no-audit --no-fund
          npm run lint
          npm run build

          rm -f .github/workflows/restore-original-system-ui.yml
          git config user.name 'Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx .github/workflows/restore-original-system-ui.yml
          git commit -m 'Restore original full system UI without changing winning logic'
          git push origin HEAD:main
