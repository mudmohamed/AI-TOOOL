name: Restore Clean SKIPPER AI TOOL

on:
  push:
    branches: [main]
    paths:
      - '.skipper-final-v2/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify exact SKIPPER source
        shell: bash
        run: |
          set -euo pipefail
          cat .skipper-final-v2/part* > /tmp/skipper.b64
          base64 -d /tmp/skipper.b64 > /tmp/skipper.tar.xz
          echo "a3a9a127368638b94888746423b9853e7dc4ffb552957abd920956aed4add19d  /tmp/skipper.tar.xz" | sha256sum -c -
          mkdir -p /tmp/skipper
          tar -xJf /tmp/skipper.tar.xz -C /tmp/skipper
          test -f /tmp/skipper/package.json
          test -f /tmp/skipper/src/App.tsx

      - name: Verify protected original engines
        shell: bash
        run: |
          set -euo pipefail
          echo "4f2993e5ebc36f4be31adb8c34e796fb58cf9b314da66d0f19d929ca93886a2a  /tmp/skipper/src/services/derivWs.ts" | sha256sum -c -
          echo "912b13f782043a0b92213da4547f088ed495a53a976eeee86657395eec7c5894  /tmp/skipper/src/utils/autoMatchesEngine.ts" | sha256sum -c -
          echo "715848847c2ec7b46d5a53f8eef6a39572ae367d74c4f1e15163e849c66a0367  /tmp/skipper/src/utils/recoveryEngine.ts" | sha256sum -c -
          echo "cd5ee92b92709de98129a5681ea2255b99196b2d3561c31ed069df69ad77522c  /tmp/skipper/src/utils/indicators.ts" | sha256sum -c -
          echo "16628a4593b6b4e3ba7463d413b9e530ee3fcc73e1fa28e43a37d2d2f7b27372  /tmp/skipper/src/components/BulkMultiTrader.tsx" | sha256sum -c -
          echo "eb5d5de85a9892351523ab0a8b4201812bb79703eb86a2adcc47d5525ecf4bbe  /tmp/skipper/src/components/DeepScanAutoMatches.tsx" | sha256sum -c -
          echo "defaa65e9a49f192451f59cc6a40a15d8d6e7321fdc9ffb9f5c8a2ede893d406  /tmp/skipper/src/components/StrongestMarketScanner.tsx" | sha256sum -c -

      - name: Reject Fasterpro mixing
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' 'fasterpro|faster pro' /tmp/skipper; then
            echo "Fasterpro marker found in SKIPPER source."
            exit 1
          fi

      - name: TypeScript and production build
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/skipper
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Replace repository with standalone SKIPPER tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "SKIPPER Restore"
          git config user.email "actions@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/skipper/. .
          git add -A
          git commit -m "Deploy clean SKIPPER AI TOOL standalone system"
          git push origin HEAD:main
