name: Package verified Vercel production build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-vercel-dist.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "sameLossStake" src/App.tsx
          ! grep -Fq "calculateNextStake(" src/App.tsx
          ! grep -Fq "Configured loss limit reached. Auto-Matches stopped." src/App.tsx
          grep -Fq "private readonly bridgeUrl" src/services/derivWs.ts
          grep -Fq "AutoTradingSystemHero" src/App.tsx
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-toool-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
