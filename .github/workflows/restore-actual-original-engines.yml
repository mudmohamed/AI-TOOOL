name: Restore actual original engines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-actual-original-engines.yml'
      - 'scripts/restore_original_engines.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore byte-verified original engines
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "sameLossStake" src/App.tsx
          ! grep -Fq "calculateNextStake(" src/App.tsx
          ! grep -Fq "Configured loss limit reached. Auto-Matches stopped." src/App.tsx

          mkdir -p /tmp/original-engines
          cat .restore/verified00 .restore/verified01 .restore/verified02 .restore/verified03 .restore/verified04 .restore/verified05 .restore/verified06 .restore/verified07 .restore/verified08a .restore/verified08b | base64 -d > /tmp/original-engines.tar.gz
          tar -xzf /tmp/original-engines.tar.gz -C /tmp/original-engines

          echo "bfbdbf0b995e89043ab293bce1ef831a4f53496be51bddf41fcc0b6c377a9eea  /tmp/original-engines/src/components/DigitProfitabilityHeatmap.tsx" | sha256sum -c -
          echo "2c9a71cf2ad9b39501be96fba0aa5f8094b2b48e5b215be65871b5cefa938717  /tmp/original-engines/src/components/RecoveryPerformanceChart.tsx" | sha256sum -c -
          echo "af3b38306f3a585c836cfee26eafaa301cc68c56c456a3110721ad3531f87950  /tmp/original-engines/src/components/StrategyBacktesterTab.tsx" | sha256sum -c -
          echo "5a3f8a4ff2381cbed66563f5f8d5678ad36979da0f1834e47e1309178da1782b  /tmp/original-engines/src/utils/backtestEngine.ts" | sha256sum -c -
          echo "0a5e622a0b807eb7d0e131a8d51c1e5bd916c4272b78c0f1db2d9ba28b54caaf  /tmp/original-engines/src/utils/csvExport.ts" | sha256sum -c -

          cp -a /tmp/original-engines/src/components/DigitProfitabilityHeatmap.tsx src/components/
          cp -a /tmp/original-engines/src/components/RecoveryPerformanceChart.tsx src/components/
          cp -a /tmp/original-engines/src/components/StrategyBacktesterTab.tsx src/components/
          cp -a /tmp/original-engines/src/utils/backtestEngine.ts src/utils/
          cp -a /tmp/original-engines/src/utils/csvExport.ts src/utils/

          python scripts/restore_original_engines.py
          npm install recharts@^3.10.1 --save --no-audit --no-fund

          grep -Fq "sameLossStake" src/App.tsx
          ! grep -Fq "calculateNextStake(" src/App.tsx
          ! grep -Fq "Configured loss limit reached. Auto-Matches stopped." src/App.tsx
          grep -Fq "findBestDiffersTarget" src/utils/autoMatchesEngine.ts

          npm run lint
          npm run build

          rm -rf .restore scripts/restore_original_engines.py .github/workflows/restore-actual-original-engines.yml
          git config user.name 'Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore full original engines without changing live execution'
          git push origin HEAD:main
