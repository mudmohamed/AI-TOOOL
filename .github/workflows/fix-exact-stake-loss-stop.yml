name: Fix exact stake and loss-stop behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exact-stake-loss-stop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact chosen stake and manual-or-target stop behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          s = s.replace("import { calculateNextStake } from './utils/recoveryEngine';\n", '')

          loss_stop = """          if (currentStats.cumulativeLoss >= (cfg.maxAcceptableLoss ?? 50)) {\n            handleStopAllBots();\n            showNotice('Configured loss limit reached. Auto-Matches stopped.');\n            return;\n          }\n"""
          if loss_stop not in s:
              raise SystemExit('Auto-Matches loss-stop block not found')
          s = s.replace(loss_stop, '', 1)

          recovery_old = """        if (!won && autoNextTradeRef.current) {\n          if (nextStats.cumulativeLoss >= recoveryCfg.stopLoss || nextStats.consecutiveLosses >= recoveryCfg.maxConsecutiveLosses) {\n            handleStopAllBots();\n            showNotice('Recovery circuit breaker reached. Automatic trading stopped.');\n            return;\n          }\n\n          const actualGrossMultiplier = settledTrade.payout > 1 ? settledTrade.payout : recoveryCfg.payoutRate;\n          const nextStake = calculateNextStake(\n            recoveryCfg.baseStake,\n            nextStats.cumulativeLoss,\n            nextStats.consecutiveLosses,\n            actualGrossMultiplier,\n            recoveryCfg.recoveryStrategy,\n          );\n          setTimeout(() => {\n            handlePlaceTradeRef.current({\n              contractType: settledTrade.contractType,\n              targetValue: settledTrade.targetValue,\n              stake: nextStake,\n              symbol: settledTrade.symbol,\n            });\n          }, 150);\n        }\n"""
          recovery_new = """        if (!won && autoNextTradeRef.current) {\n          // Recovery repeats the exact losing contract stake and target.\n          // No hidden stake multiplication and no automatic loss-count stop.\n          const sameLossStake = Number(settledTrade.stake);\n          setTimeout(() => {\n            handlePlaceTradeRef.current({\n              contractType: settledTrade.contractType,\n              targetValue: settledTrade.targetValue,\n              stake: Number.isFinite(sameLossStake) && sameLossStake > 0 ? sameLossStake : recoveryCfg.baseStake,\n              symbol: settledTrade.symbol,\n            });\n          }, 150);\n        }\n"""
          if recovery_old not in s:
              raise SystemExit('Recovery escalation block not found')
          s = s.replace(recovery_old, recovery_new, 1)
          p.write_text(s)
          PY

          grep -Fq "Configured profit target reached. Auto-Matches stopped." src/App.tsx
          ! grep -Fq "Configured loss limit reached. Auto-Matches stopped." src/App.tsx
          ! grep -Fq "Recovery circuit breaker reached. Automatic trading stopped." src/App.tsx
          ! grep -Fq "calculateNextStake(" src/App.tsx
          grep -Fq "sameLossStake" src/App.tsx

          npm install --no-audit --no-fund
          npm run lint
          npm run build

          rm -f .github/workflows/fix-exact-stake-loss-stop.yml
          git config user.name 'Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Keep exact chosen stake and never stop on loss'
          git push origin HEAD:main
